name: Docs (Axo Tales)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hytale/Axo-Tales/mkdocs.yml"
      - "hytale/Axo-Tales/docs/**"
      - ".github/workflows/pages-axo-tales.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-axo-tales"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Build site
        working-directory: hytale/Axo-Tales
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: hytale/Axo-Tales/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

